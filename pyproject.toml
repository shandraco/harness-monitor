[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-monitor"
version = "0.1.0"
description = "Live diagram of an AI agent harness as a coding agent (Claude Code, Codex) builds it."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []
authors = [{name = "shandraco"}]
keywords = ["agents", "harness", "claude-code", "codex", "visualization"]

[project.urls]
Homepage = "https://github.com/shandraco/harness-monitor"

[project.scripts]
harnessmonitor = "harness_monitor.cli:main"

[tool.setuptools]
packages = ["harness_monitor"]

[tool.setuptools.package-data]
harness_monitor = ["web/*", "web/vendor/*"]
